services:
  mysql:
    image: mysql:8.4
    container_name: combinations-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: combinations-api
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build: .
    image: combinations-api
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mysql-data: